name: forpay
services:
  app:
    build: .
    image: ${FORPAY_IMAGE:-litehub/forpay:0.1.2}
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      FORPAY_DATABASE_URL: postgresql+psycopg://forpay:forpay@postgres:5432/forpay
      FORPAY_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  worker:
    build: .
    image: ${FORPAY_IMAGE:-litehub/forpay:0.1.2}
    env_file: .env
    environment:
      FORPAY_DATABASE_URL: postgresql+psycopg://forpay:forpay@postgres:5432/forpay
      FORPAY_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.worker"]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      disable: true
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: forpay, POSTGRES_USER: forpay, POSTGRES_PASSWORD: forpay}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [forpay-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forpay -d forpay"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [forpay-redis:/data]
volumes:
  forpay-postgres:
  forpay-redis:
